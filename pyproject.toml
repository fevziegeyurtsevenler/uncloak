[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uncloak"
description = "Reveal hidden prompt injection & supply-chain risks in AI agent extensions (skills, MCP servers, rules files). Zero dependencies."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Fevzi Ege Yurtsevenler" }]
keywords = [
    "llm-security", "prompt-injection", "mcp", "model-context-protocol",
    "agent-security", "ai-security", "supply-chain", "unicode-smuggling",
    "claude", "agent-skills", "sarif", "sast", "red-teaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/fevziegeyurtsevenler/uncloak"
Repository = "https://github.com/fevziegeyurtsevenler/uncloak"
Issues = "https://github.com/fevziegeyurtsevenler/uncloak/issues"
Documentation = "https://github.com/fevziegeyurtsevenler/uncloak#readme"

[project.scripts]
uncloak = "uncloak.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.version]
path = "src/uncloak/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uncloak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
