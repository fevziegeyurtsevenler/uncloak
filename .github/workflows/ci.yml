name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: uncloak should flag the malicious fixture (expect exit 2)
        run: |
          if uncloak scan tests/fixtures/malicious; then
            echo "::error::malicious fixture was NOT flagged"; exit 1
          else
            echo "malicious fixture correctly flagged"
          fi
      - name: uncloak should pass the clean fixture (expect exit 0)
        run: uncloak scan tests/fixtures/clean
